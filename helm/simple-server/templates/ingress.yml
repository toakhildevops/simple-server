apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-server-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - host: simple-server.naynutty.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-server
                port:
                  number: 80   # <- service port, not pod port
